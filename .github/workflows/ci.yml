name: CI

on:
  push:
    branches: [main, feat/ai-provider-failover-ocr-search, fix/pr9-analysis-integrity]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x === "string" ? x : {title:x.title,url:x.url,range:x.range})})); console.log("Summary:", JSON.stringify(a.metadata?.vulnerabilities || {}))'
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm run test:run
      - name: Build production bundle
        run: npm run build
